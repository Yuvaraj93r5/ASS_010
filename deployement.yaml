apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-predictive-dashboard
  labels:
    app: iot-predictive-dashboard
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: iot-predictive-dashboard
  template:
    metadata:
      labels:
        app: iot-predictive-dashboard
    spec:
      containers:
      - name: dashboard
        image: yuvaraj93/iot-predictive-dashboard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        # Configuration parameters ensuring automated rollback targets if faulty version initializes
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: iot-predictive-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 32080
  selector:
    app: iot-predictive-dashboard
